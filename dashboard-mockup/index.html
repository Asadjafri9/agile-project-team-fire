<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101b32" />
    <meta name="description" content="An interactive mock dashboard for the Agile Project Management Platform WBS." />
    <title>Overview · Sprintwise</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="script.js"></script>
  </head>
  <body>
    <svg class="icon-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M3 6h.01M3 12h.01M3 18h.01"/></symbol>
      <symbol id="i-board" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16M5.5 8h1M11.5 8h1M17.5 8h1M11.5 12h1"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 20h18M6 16V9M11 16V4M16 16v-6M21 16v-9"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2H3ZM17 5a3 3 0 0 1 0 6M17 14a5 5 0 0 1 4 5v1h-4"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10l-7-7Z"/><path d="M13 3v7h7M8 15h8M8 18h6"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4m0 1c3-2 5 2 8 0s5 0 6 0v11c-3-2-5 2-8 0s-4 0-6 0"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 2 7 7 3-7 2-2 8-2-8-7-2 7-3 2-7Z"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5 19 19M19 5 5 19"/></symbol>
    </svg>

    <div class="shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span><span>sprintwise<span class="brand-dot">.</span></span></div>
        <div class="workspace-picker"><span class="workspace-avatar">AF</span><span class="workspace-copy"><strong>Agile PM Platform</strong><small>Team Fire workspace</small></span><svg class="icon"><use href="#i-chevron"/></svg></div>
        <div class="sidebar-label">WORKSPACE</div>
        <nav class="nav" aria-label="Main navigation">
          <button type="button" data-view="overview" class="nav-link active"><svg class="icon"><use href="#i-grid"/></svg>Overview</button>
          <button type="button" data-view="backlog" class="nav-link"><svg class="icon"><use href="#i-list"/></svg>Product backlog</button>
          <button type="button" data-view="board" class="nav-link"><svg class="icon"><use href="#i-board"/></svg>Sprint board</button>
          <button type="button" data-view="analytics" class="nav-link"><svg class="icon"><use href="#i-chart"/></svg>Analytics</button>
          <button type="button" data-view="team" class="nav-link"><svg class="icon"><use href="#i-users"/></svg>Team</button>
        </nav>
        <div class="sidebar-label sidebar-label-space">PROJECT</div>
        <nav class="nav" aria-label="Project navigation"><button type="button" data-view="artefacts" class="nav-link"><svg class="icon"><use href="#i-file"/></svg>Agile artefacts</button></nav>
        <div class="sidebar-spacer"></div>
        <div class="sidebar-tip"><span class="tip-icon"><svg class="icon"><use href="#i-spark"/></svg></span><strong>Built for every sprint.</strong><p>Keep your team, work, and progress in one clear view.</p><button type="button" data-view="artefacts">Explore artefacts <svg class="icon"><use href="#i-arrow"/></svg></button></div>
        <div class="sidebar-profile"><span class="avatar avatar-profile">AC</span><span><strong>Alex Carter</strong><small>Scrum Master</small></span><svg class="icon"><use href="#i-more"/></svg></div>
      </aside>

      <div class="content-shell">
        <header class="topbar">
          <button class="mobile-menu icon-button" type="button" id="menu-toggle" aria-label="Open menu" aria-expanded="false"><svg class="icon"><use href="#i-grid"/></svg></button>
          <div class="breadcrumbs"><span>Workspace</span><span class="crumb-separator">/</span><strong id="breadcrumb-current">Overview</strong></div>
          <div class="top-actions"><span class="demo-pill"><span></span> Demo workspace</span><button type="button" class="icon-button notification-button" id="notification-button" aria-label="Notifications"><svg class="icon"><use href="#i-bell"/></svg><i></i></button><span class="avatar avatar-top">AC</span></div>
        </header>
        <main id="app" class="main-content" tabindex="-1"></main>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="modal-backdrop" id="task-modal" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button type="button" class="icon-button modal-close" id="modal-close" aria-label="Close task details"><svg class="icon"><use href="#i-close"/></svg></button><div id="modal-content"></div></div></div>
  </body>
</html>
